<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Dodge Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Car Dodge 🚗</h1>
    <p class="instructions">Use ⬅️ and ➡️ arrow keys (or A/D) to avoid traffic.</p>

    <section class="hud" aria-live="polite">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </section>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="360" height="600" aria-label="Car game canvas"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Press Space to start the race.</p>
        <button id="startBtn" type="button">Start</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
